name: Build and verify
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 'G:\'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Map workspace to the permitted drive
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          subst G: "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot map the workspace to G:.' }
      - name: Core, editor and application checks
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Publish Windows application
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Build a two-section scene with the published command line
        shell: pwsh
        run: |
          ./artifacts/app/simplepzmap.exe build examples/CiScene/ci-scene.json --out work/ci/ci.pzworld.json --export work/ci/ci.zip --strict
          if ($LASTEXITCODE -ne 0) { throw 'simplepzmap build --strict failed.' }
          ./artifacts/app/simplepzmap.exe validate work/ci/ci.pzworld.json --source examples/CiScene/ci-source.geojson
          if ($LASTEXITCODE -ne 0) { throw 'simplepzmap validate --source failed.' }
      - name: Install isolated browser check dependencies
        shell: pwsh
        run: |
          . ./scripts/WorkspaceEnv.ps1
          npm ci --prefix tools/BrowserSmoke --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependency installation failed.' }
          node tools/BrowserSmoke/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed.' }
      - name: Launch the published application and exercise its editor
        shell: pwsh
        run: ./scripts/verify-actions-startup.ps1
      - name: Verify all cells of the example mod
        shell: pwsh
        run: node scripts/verify-native-map.mjs
      - name: Package application
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Check public source and package for local path disclosure
        shell: pwsh
        run: |
          . ./scripts/WorkspaceEnv.ps1
          node scripts/verify-public-paths.mjs artifacts/SimplePZMapmaker-0.12.0-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Public package path check failed.' }
      - name: Verify signed basement example
        shell: pwsh
        run: node scripts/verify-native-map.mjs examples/Basements/Basements-B42.zip
      - name: Verify the complete 64-level example
        shell: pwsh
        run: node scripts/verify-native-map.mjs examples/FullVerticalRange/FullVerticalRange-B42.zip
      - name: Verify resource/style example
        shell: pwsh
        run: node scripts/verify-native-map.mjs examples/Assets/Resources-B42.zip
      - name: Verify Smolensk regional example
        shell: pwsh
        run: node scripts/verify-native-map.mjs examples/Smolensk/Smolensk-B42.zip
      - name: Verify twenty-four housing templates example
        shell: pwsh
        run: node scripts/verify-native-map.mjs examples/HousingTemplates/HousingTemplates-B42.zip
      - name: Verify stitched world and live OSM examples
        shell: pwsh
        run: |
          foreach ($archive in @('Worlds-B42.zip', 'Smolensk-small-B42.zip', 'World-DEM-B42.zip')) {
            node scripts/verify-native-map.mjs (Join-Path 'examples/Worlds' $archive)
            if ($LASTEXITCODE -ne 0) { throw "Native world verification failed: $archive" }
          }
      - name: Verify shared infrastructure and parametric world showcase
        shell: pwsh
        run: node scripts/verify-native-map.mjs examples/WorldAuthoring/WorldAuthoring-B42.zip
      - name: Upload ready-to-run Windows application
        uses: actions/upload-artifact@v7
        with:
          name: SimplePZMapmaker-win-x64
          path: G:/artifacts/SimplePZMapmaker-*-win-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload application startup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Application-startup-check
          path: G:/work/actions-smoke/
          if-no-files-found: warn
          retention-days: 14
